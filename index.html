<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore how correlated uncertainties change the geometry of three model predictions.">
  <title>Combining uncertain predictions</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="viewer-column">
      <div id="view3d" class="viewer" aria-label="Three model predictions in a plane, with a calculated combined point above it">
        <div id="loading3d" class="loading">Loading 3D viewer…</div>
        <div class="legend"><span>△ Convex combinations</span><span class="purple">┄ Possible path of Σ</span></div>
      </div>
      <div class="help">
        <span><strong>Drag A, B or C:</strong> move in the plane</span>
        <span><strong>Drag empty space:</strong> rotate</span>
        <span><strong>Scroll:</strong> zoom</span>
      </div>
      <p id="status" class="note" role="status"></p>
    </section>
    <aside class="controls">
      <section class="control-section">
        <h2>A–B correlation</h2>
        <div class="rho">ρ = <output id="rhoValue" for="correlation">0.000</output></div>
        <label for="correlation">Correlation</label>
        <input id="correlation" type="range" min="-0.99" max="0.99" value="0" step="any">
        <p id="rangeValue" class="note"></p>
        <button id="uncorrelated" type="button">Reset correlation</button>
        <p id="angles" class="angle-readout"></p>
      </section>
      <section class="control-section">
        <h2>Model locations</h2>
        <table class="locations">
          <thead><tr><th scope="col">Model</th><th scope="col">Plane X</th><th scope="col">Plane Y</th></tr></thead>
          <tbody>
            <tr><th scope="row">A</th><td id="location-0-x">—</td><td id="location-0-y">—</td></tr>
            <tr><th scope="row">B</th><td id="location-1-x">—</td><td id="location-1-y">—</td></tr>
            <tr><th scope="row">C</th><td id="location-2-x">—</td><td id="location-2-y">—</td></tr>
          </tbody>
        </table>
      </section>
      <div class="actions">
        <button id="fitButton" type="button" disabled>Fit view</button>
        <button id="resetButton" type="button" class="secondary" disabled>Reset</button>
      </div>
    </aside>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
